<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>머슬 비치 체육관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf1dc;--card:#fffaf0;--ink:#3a2a1c;--sub:#8a735c;--line:#ead7b8;--coral:#ee5a4a;--teal:#1f8a8a;--sun:#f6b73c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--card:#2a2219;--ink:#f5e8d2;--sub:#b9a387;--line:#443826;--coral:#ff7a68;--teal:#4cc3c0;--sun:#f6b73c}}
:root[data-theme="dark"]{--bg:#1d1812;--card:#2a2219;--ink:#f5e8d2;--sub:#b9a387;--line:#443826;--coral:#ff7a68;--teal:#4cc3c0;--sun:#f6b73c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{margin:6px 0 2px;font-size:28px;letter-spacing:-.5px}
.sub{color:var(--sub);font-size:14px;margin:0 0 12px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tabs button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 4px;font:inherit;font-size:15px;cursor:pointer}
.tabs button.on{border-color:var(--coral);background:var(--coral);color:#fff}
.tabs button:disabled{opacity:.5}
.stage{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#cfeaf5}
canvas{display:block;width:100%;height:auto}
.hud{position:absolute;left:0;right:0;top:8px;text-align:center;pointer-events:none}
.big{font-size:54px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.say{font-size:16px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.bar{height:10px;background:var(--line);border-radius:6px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.card p{margin:0 0 6px}
ul.cues{margin:6px 0;padding-left:20px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row span{flex:1}
.mini{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:4px 12px;font:inherit;cursor:pointer;min-width:38px}
.mini.on{border-color:var(--teal);background:var(--teal);color:#fff}
.go{width:100%;border:0;border-radius:14px;background:var(--coral);color:#fff;font:inherit;font-size:20px;padding:12px;margin-top:6px;cursor:pointer}
.stop{background:var(--sub)}
.hide{display:none}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0;font-size:14px}
</style>
</head>
<body>
<main>
<h1>🌴 머슬 비치 체육관</h1>
<p class="sub">인형이 시범을 보이면 같은 박자로 따라 하는 맨몸 운동이에요.</p>
<div class="tabs" id="tabs"></div>
<div class="stage"><canvas id="cv" width="520" height="300"></canvas>
<div class="hud"><div class="big" id="big"></div><div class="say" id="say"></div></div></div>
<div class="bar hide" id="barw"><i id="bar"></i></div>

<div class="card" id="setup">
<p id="desc"></p><ul class="cues" id="cues"></ul><p class="sub" id="easy"></p>
<div class="row"><span id="lbR"></span><button class="mini" data-g="r-">−</button><b id="vR"></b><button class="mini" data-g="r+">＋</button></div>
<div class="row"><span>세트</span><button class="mini" data-g="s-">−</button><b id="vS"></b><button class="mini" data-g="s+">＋</button></div>
<div class="row"><span>쉬는 시간</span><span id="rests" style="flex:none"></span></div>
<div class="row"><span>숫자 세는 소리</span><button class="mini" id="snd"></button></div>
<button class="go" id="start"></button>
<p class="sub" style="margin-top:8px">아프거나 어지러우면 바로 멈추고 쉬어요.</p>
</div>

<div class="card hide" id="run">
<p id="cue"></p>
<div class="row"><button class="mini" id="pause">⏸ 잠깐 멈춤</button><button class="mini" id="quit">⏹ 그만하기</button></div>
</div>

<div class="card" id="logc"><p><b>📅 내 기록</b></p><div id="stat"></div><div id="list" class="sub"></div></div>
</main>

<script>
'use strict';
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), g = cv.getContext('2d'), W = 520, H = 300, GY = 248, SC = 135;

/* ---------- 운동 정보 ---------- */
var DEF = {
  jack:{n:'팔 벌려 뛰기',e:'🙆',unit:'개',tempo:1.3,reps:20,sets:1,desc:'온몸을 깨우는 준비운동이에요.',cues:['발을 벌리며 팔을 머리 위로','착지할 때 무릎을 살짝 굽혀 부드럽게','숨을 멈추지 말고 리듬 타기'],easy:'쉽게: 뛰지 말고 한 발씩 옆으로 벌리기'},
  squat:{n:'스쿼트',e:'🏋️',unit:'개',tempo:3,reps:15,sets:3,desc:'엉덩이를 뒤로 빼며 의자에 앉듯 내려가요.',cues:['발은 어깨너비, 발끝은 살짝 바깥','무릎이 안쪽으로 모이지 않게','허리는 곧게, 가슴은 앞으로'],easy:'쉽게: 의자에 살짝 앉았다 일어나기'},
  lunge:{n:'런지',e:'🦵',unit:'개',tempo:3.2,reps:10,sets:2,desc:'한 발 앞으로 내딛고 두 무릎을 굽혀요. 왼발·오른발 번갈아 한 번씩 세요.',cues:['앞 무릎은 발목 위에','상체는 똑바로 세우기','뒷무릎은 바닥에 닿기 직전까지만'],easy:'쉽게: 벽이나 의자를 잡고 하기'},
  pushup:{n:'팔굽혀펴기',e:'💪',unit:'개',tempo:3,reps:8,sets:2,desc:'몸을 한 줄로 곧게 펴고 팔을 굽혔다 펴요.',cues:['머리부터 발끝까지 한 줄','손은 어깨 바로 아래','가슴이 바닥 가까이 갈 때까지 천천히'],easy:'쉽게: 무릎을 바닥에 대고 하기'},
  plank:{n:'플랭크',e:'🧱',unit:'초',tempo:4,reps:30,sets:2,desc:'팔꿈치로 버티며 몸을 판자처럼 곧게 유지해요.',cues:['팔꿈치는 어깨 바로 아래','엉덩이가 너무 올라가거나 처지지 않게','배에 힘주고 숨은 천천히'],easy:'쉽게: 무릎을 대고 버티기'},
  burpee:{n:'버피테스트',e:'🔥',unit:'개',tempo:5,reps:6,sets:2,desc:'앉기 → 엎드려 버티기 → 앉기 → 점프! 네 동작이 한 번이에요.',cues:['손을 짚을 때 어깨 아래에','엎드렸을 때 허리가 처지지 않게','점프는 가볍게, 착지는 부드럽게'],easy:'쉽게: 점프 없이, 발을 한 발씩 뒤로'}
};
var ORDER = ['jack','squat','lunge','pushup','plank','burpee'];

/* ---------- 인형 동작 (옆모습 · 각도는 아래쪽 기준 앞으로 +) ---------- */
var D0 = {hip:[0,0],knee:[0,0],sh:[.05,.05],el:[.12,.12],tl:0,T:0,lift:0,nod:0};
function P(o){ var p = JSON.parse(JSON.stringify(D0)); for (var k in o) p[k] = o[k]; return p; }
function mix(a,b,u){ var o = {}; for (var k in a){ o[k] = Array.isArray(a[k]) ? [a[k][0]+(b[k][0]-a[k][0])*u, a[k][1]+(b[k][1]-a[k][1])*u] : a[k]+(b[k]-a[k])*u; } return o; }
function keys(ks,ph){ for (var i = 1; i < ks.length; i++) if (ph <= ks[i][0]){ var a = ks[i-1], b = ks[i], u = (ph-a[0])/Math.max(1e-6,b[0]-a[0]); return mix(a[1],b[1],u*u*(3-2*u)); } return ks[ks.length-1][1]; }
var S0 = P({}), HANDS = {sh:[.15,.15],el:[1.5,1.5]};
var TUP = 1.159, TDN = 1.35;
var PUP = P({T:TUP,sh:[TUP,TUP],el:[0,0],nod:-.2}), PDN = P({T:TDN,sh:[TDN,TDN],el:[0,0],nod:-.2});
var SQH = P({hip:[1.5,1.5],knee:[1.9,1.9],tl:1.1,sh:[0,0],el:[0,0]});
var POSE = {
  idle:function(ph){ var b = Math.sin(ph*6.283)*.03; return P({tl:b*.5,sh:[.05+b,.05+b]}); },
  squat:function(ph){ return keys([[0,S0],[.5,P({hip:[1.35,1.35],knee:[1.75,1.75],tl:.55,sh:[1.45,1.45],el:[0,0]})],[1,S0]],ph); },
  lunge:function(ph,rep){ var f = rep%2, up = P(HANDS), low = P({tl:.05,sh:HANDS.sh,el:HANDS.el}); low.hip[f] = 1; low.knee[f] = 1.3; low.hip[1-f] = -.5; low.knee[1-f] = .75; return keys([[0,up],[.5,low],[1,up]],ph); },
  pushup:function(ph){ return keys([[0,PUP],[.5,PDN],[1,PUP]],ph); },
  plank:function(ph){ var b = Math.sin(ph*6.283)*.012; return P({T:1.35+b,sh:[1.35+b,1.35+b],el:[1.57,1.57],nod:-.25}); },
  burpee:function(ph){ return keys([[0,S0],[.18,SQH],[.36,PUP],[.56,PUP],[.72,SQH],[.86,P({lift:.3,sh:[3,3],el:[0,0]})],[1,S0]],ph); }
};

/* ---------- 그리기 ---------- */
function M(p){ return [W/2+p[0]*SC, GY-p[1]*SC]; }
function ln(a,b,w,c){ var A = M(a), B = M(b); g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(A[0],A[1]); g.lineTo(B[0],B[1]); g.stroke(); }
function dot(p,r,c){ var A = M(p); g.fillStyle = c; g.beginPath(); g.arc(A[0],A[1],r,0,6.283); g.fill(); }
var SKIN = '#e8b48a', TOP = '#ee5a4a', BOT = '#1f6f8a', SHOE = '#ffffff', HAIR = '#3a2a1c';
function scene(){
  var gr = g.createLinearGradient(0,0,0,GY); gr.addColorStop(0,'#8fd3f4'); gr.addColorStop(1,'#fde8c8');
  g.fillStyle = gr; g.fillRect(0,0,W,H);
  g.fillStyle = '#f6b73c'; g.beginPath(); g.arc(440,60,30,0,6.283); g.fill();
  g.fillStyle = '#f2d49b'; g.fillRect(0,GY,W,H-GY);
  g.strokeStyle = '#e2bd7c'; g.lineWidth = 2; g.beginPath(); g.moveTo(0,GY); g.lineTo(W,GY); g.stroke();
  g.strokeStyle = '#8a5a2b'; g.lineWidth = 7; g.beginPath(); g.moveTo(60,GY); g.quadraticCurveTo(70,GY-70,58,GY-120); g.stroke();
  g.fillStyle = '#2f9e5a'; [[-34,-14],[-18,-30],[8,-30],[30,-12]].forEach(function(l){ g.beginPath(); g.ellipse(58+l[0]/2,GY-124+l[1]/2,22,7,Math.atan2(l[1],l[0]),0,6.283); g.fill(); });
}
function front(ph){
  var u = (1-Math.cos(ph*6.283))/2, b = .04+.3*u, c = .15+2.75*u, lift = .14*Math.sin(Math.PI*u);
  var hy = .9*Math.cos(b)+lift, hip = [0,hy], sh = [0,hy+.6];
  [-1,1].forEach(function(s){ var f = [s*(.07+.9*Math.sin(b)),lift]; ln([s*.07,hy],[s*.07+s*.9*Math.sin(b)*.5,hy-.45*Math.cos(b)],14,SKIN); ln([s*.07+s*.9*Math.sin(b)*.5,hy-.45*Math.cos(b)],f,13,SKIN); ln(f,[f[0]+s*.1,lift],10,SHOE); });
  ln(hip,sh,26,TOP); ln([-.1,hy],[.1,hy],18,BOT);
  [-1,1].forEach(function(s){ var a = [s*.15,hy+.57], h = [a[0]+s*Math.sin(c)*.6,a[1]-Math.cos(c)*.6]; ln(a,h,10,SKIN); ln(a,[a[0]+s*Math.sin(c)*.3,a[1]-Math.cos(c)*.3],12,TOP); });
  var hd = [0,hy+.86]; dot(hd,19,SKIN); dot([0,hd[1]+.03],19,'rgba(0,0,0,0)'); g.fillStyle = HAIR; var H0 = M(hd); g.beginPath(); g.arc(H0[0],H0[1]-3,19,3.3,6.1); g.fill();
}
function side(ex,P_,rep){
  var L = [0,1].map(function(i){ var k = [Math.sin(P_.hip[i])*.45,-Math.cos(P_.hip[i])*.45], a = P_.hip[i]-P_.knee[i]; return [k,[k[0]+Math.sin(a)*.45,k[1]-Math.cos(a)*.45]]; });
  var sh = [Math.sin(P_.tl)*.6,Math.cos(P_.tl)*.6], hd = [sh[0]+Math.sin(P_.tl+P_.nod)*.26,sh[1]+Math.cos(P_.tl+P_.nod)*.26];
  var pv = L[0][1][1] <= L[1][1][1] ? L[0][1] : L[1][1], c = Math.cos(P_.T), s = Math.sin(P_.T);
  var X0 = -.85*Math.min(1,P_.T/1.1), tx = ex === 'lunge' ? 0 : X0-pv[0], ty = P_.lift-pv[1];
  function Wd(p){ var dx = p[0]-pv[0], dy = p[1]-pv[1]; return [pv[0]+dx*c+dy*s+tx, pv[1]-dx*s+dy*c+ty]; }
  var hip = Wd([0,0]), shW = Wd(sh), hdW = Wd(hd);
  var legs = L.map(function(l){ return [Wd(l[0]),Wd(l[1])]; });
  var arms = [0,1].map(function(i){
    if (ex === 'pushup'){   // 손은 바닥에 고정, 팔꿈치는 뒤로 꺾임
      var T = [-.85+1.5*Math.sin(TUP),.02], dx = T[0]-shW[0], dy = T[1]-shW[1], d = Math.min(Math.hypot(dx,dy),.599);
      var a = Math.acos((.09+d*d-.09)/(2*.3*d)), base = Math.atan2(dy,dx)-a;
      var e = [shW[0]+.3*Math.cos(base),shW[1]+.3*Math.sin(base)]; return [e,T];
    }
    var A1 = P_.sh[i], A2 = A1+P_.el[i], e1 = [sh[0]+Math.sin(A1)*.3,sh[1]-Math.cos(A1)*.3], h1 = [e1[0]+Math.sin(A2)*.3,e1[1]-Math.cos(A2)*.3];
    return [Wd(e1),Wd(h1)];
  });
  g.fillStyle = 'rgba(0,0,0,.12)'; var sx = M([hip[0],0]); g.beginPath(); g.ellipse(sx[0],GY+4,60,6,0,0,6.283); g.fill();
  ln(shW,arms[1][0],10,'#c98f68'); ln(arms[1][0],arms[1][1],9,'#c98f68');
  ln(legs[1][0],legs[1][1],12,'#c98f68'); ln(hip,legs[1][0],13,'#c98f68');
  ln(hip,shW,26,TOP); ln(hip,[hip[0]+(legs[0][0][0]-hip[0])*.4,hip[1]+(legs[0][0][1]-hip[1])*.4],19,BOT);
  legs.forEach(function(l,i){ if (i === 0) return; });
  [0,1].forEach(function(i){ var l = legs[i], col = i ? '#c98f68' : SKIN; if (i === 0){ ln(hip,l[0],14,SKIN); ln(l[0],l[1],13,SKIN); } ln(l[1],[l[1][0]+.14,l[1][1]],10,SHOE); });
  dot(hdW,20,SKIN); var H0 = M(hdW); g.fillStyle = HAIR; g.beginPath(); g.arc(H0[0],H0[1]-2,20,Math.PI*.55+.0,Math.PI*1.9); g.fill();
  g.fillStyle = '#2a2320'; g.beginPath(); g.arc(H0[0]+8,H0[1]-1,2.2,0,6.283); g.fill();
  ln(shW,arms[0][0],11,TOP); ln(arms[0][0],arms[0][1],9,SKIN);
}
function draw(ex,ph,rep){ scene(); if (ex === 'jack') front(ph); else side(ex,POSE[ex](ph,rep),rep); }

/* ---------- 소리 ---------- */
var KN = ['','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'], KT = ['','열','스물','서른','마흔','쉰'];
function kor(n){ if (n <= 0) return ''; if (n > 59) return String(n); return KT[Math.floor(n/10)]+KN[n%10]; }
var actx = null;
function beep(hz){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); var o = actx.createOscillator(), v = actx.createGain(); o.frequency.value = hz; v.gain.value = .06; o.connect(v); v.connect(actx.destination); o.start(); o.stop(actx.currentTime+.09); } catch (e) {} }
function say(t,hz){ if (!st.sound) return; beep(hz || 800); try { if (window.speechSynthesis && t){ speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = 1.1; speechSynthesis.speak(u); } } catch (e) {} }

/* ---------- 상태 ---------- */
var st = {ex:'squat',reps:15,sets:3,rest:30,sound:true,stage:'setup',set:1,rep:0,t0:0,paused:false,pAt:0,done:0,last:-1};
var LOG = [];
try { LOG = JSON.parse(localStorage.getItem('gym_log') || '[]'); } catch (e) { LOG = []; }
function dayKey(off){ var d = new Date(Date.now()-off*86400000); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function save(ex,n){ LOG.push({d:dayKey(0),ex:ex,n:n}); LOG = LOG.slice(-200); try { localStorage.setItem('gym_log',JSON.stringify(LOG)); } catch (e) {} renderLog(); }
function renderLog(){
  var days = {}; LOG.forEach(function(r){ days[r.d] = 1; });
  var streak = 0, o = days[dayKey(0)] ? 0 : 1; while (days[dayKey(o+streak)]) streak++;
  var wk = 0; for (var i = 0; i < 7; i++) if (days[dayKey(i)]) wk++;
  $('stat').innerHTML = '<span class="chip">🔥 연속 '+streak+'일</span><span class="chip">이번 주 '+wk+'일</span>';
  $('list').textContent = LOG.length ? LOG.slice(-5).reverse().map(function(r){ var d = DEF[r.ex]; return r.d.slice(5)+' '+d.n+' '+r.n+d.unit; }).join(' · ') : '아직 기록이 없어요. 첫 운동을 해 봐요!';
}

/* ---------- 화면 ---------- */
function pick(ex){
  st.ex = ex; var d = DEF[ex]; st.reps = d.reps; st.sets = d.sets; st.stage = 'setup'; st.t0 = performance.now();
  Array.prototype.forEach.call($('tabs').children,function(b){ b.classList.toggle('on',b.dataset.ex === ex); });
  $('desc').textContent = d.desc; $('cues').innerHTML = d.cues.map(function(c){ return '<li>'+c+'</li>'; }).join(''); $('easy').textContent = '💡 '+d.easy;
  $('lbR').textContent = d.unit === '초' ? '버티기' : '한 세트'; fill();
}
function fill(){
  var d = DEF[st.ex]; $('vR').textContent = st.reps+d.unit; $('vS').textContent = st.sets+'세트';
  $('start').textContent = '▶ 시작하기 ('+st.reps+d.unit+' × '+st.sets+'세트)';
  $('rests').innerHTML = [20,30,45].map(function(r){ return '<button class="mini'+(st.rest === r ? ' on' : '')+'" data-r="'+r+'">'+r+'초</button>'; }).join(' ');
  $('snd').textContent = st.sound ? '🔊 켜짐' : '🔈 꺼짐'; $('snd').classList.toggle('on',st.sound);
}
function show(run){ $('setup').classList.toggle('hide',run); $('run').classList.toggle('hide',!run); $('barw').classList.toggle('hide',!run); if (!run){ $('big').textContent = ''; $('say').textContent = ''; } }
$('tabs').innerHTML = ORDER.map(function(k){ return '<button data-ex="'+k+'">'+DEF[k].e+' '+DEF[k].n+'</button>'; }).join('');
$('tabs').addEventListener('click',function(e){ var b = e.target.closest('button'); if (b && !b.disabled){ show(false); pick(b.dataset.ex); } });
$('setup').addEventListener('click',function(e){
  var b = e.target.closest('button'); if (!b) return; var d = DEF[st.ex], sec = d.unit === '초';
  if (b.dataset.g){ var v = b.dataset.g; if (v[0] === 'r') st.reps = Math.max(sec ? 5 : 1,Math.min(sec ? 120 : 50,st.reps+(v[1] === '+' ? 1 : -1)*(sec ? 5 : 1))); else st.sets = Math.max(1,Math.min(5,st.sets+(v[1] === '+' ? 1 : -1))); beep(700); }
  if (b.dataset.r) st.rest = +b.dataset.r;
  if (b.id === 'snd') st.sound = !st.sound;
  if (b.id === 'start') begin();
  fill();
});
$('pause').onclick = function(){ var n = performance.now(); if (st.paused){ st.t0 += n-st.pAt; st.paused = false; $('pause').textContent = '⏸ 잠깐 멈춤'; } else { st.paused = true; st.pAt = n; $('pause').textContent = '▶ 이어서 하기'; } };
$('quit').onclick = function(){ finish(false); };

/* ---------- 진행 ---------- */
function begin(){ st.stage = 'ready'; st.set = 1; st.rep = 0; st.done = 0; st.t0 = performance.now(); st.paused = false; st.last = -1; show(true); $('cue').textContent = DEF[st.ex].cues[0]; say('준비'); }
function setDone(){ if (st.set >= st.sets){ finish(true); return; } st.set++; st.stage = 'rest'; st.t0 = performance.now(); st.last = -1; say((st.set-1)+'세트 끝! 쉬어요',990); }
function finish(ok){
  var d = DEF[st.ex], amount = st.done;
  if (!ok && d.unit === '초' && st.stage === 'work') amount += Math.min(st.reps,Math.floor(((st.paused ? st.pAt : performance.now())-st.t0)/1000));
  st.stage = 'setup'; try { speechSynthesis.cancel(); } catch (e) {} show(false);
  if (amount > 0){ save(st.ex,amount); say(ok ? '잘했어요! 끝' : '', 1175); $('say').textContent = (ok ? '🎉 다 했어요! ' : '여기까지 기록! ')+d.n+' '+amount+d.unit; $('big').textContent = '🏅'; }
}
function tick(){
  var d = DEF[st.ex], sec = d.unit === '초', now = st.paused ? st.pAt : performance.now(), t = (now-st.t0)/1000;
  if (st.stage === 'setup'){ var tp = d.tempo; draw(st.ex,(now/1000/tp)%1,Math.floor(now/1000/tp)); }
  else if (st.stage === 'ready'){
    var left = 3-Math.floor(t); draw(st.ex,0,0); $('say').textContent = st.set+'세트 / '+st.sets+(st.set === 1 ? ' · 준비!' : ' · 다음 세트 준비!'); $('big').textContent = left > 0 ? left : '시작!'; $('bar').style.width = '0%';
    if (left !== st.last){ st.last = left; if (left > 0) say(KN[left],660); else say('시작',990); }
    if (t >= 3.4){ st.stage = 'work'; st.t0 = now; st.rep = 0; st.last = -1; }
  } else if (st.stage === 'work'){
    if (sec){
      var s = Math.floor(t); draw(st.ex,(t/4)%1,0); $('big').textContent = Math.min(s,st.reps)+'초'; $('say').textContent = '목표 '+st.reps+'초 · 버텨요!'; $('bar').style.width = Math.min(100,t/st.reps*100)+'%'; $('cue').textContent = d.cues[Math.floor(t/6)%3];
      if (s !== st.last){ st.last = s; var rem = st.reps-s; if (s > 0 && rem > 0 && rem <= 3) say(KN[rem],660); else if (s > 0 && s%10 === 0 && rem > 0) say(s+'초',880); }
      if (t >= st.reps){ st.done += st.reps; setDone(); }
    } else {
      var ph = t/d.tempo, rep = Math.floor(ph), p = ph%1; draw(st.ex,p,rep);
      if (rep !== st.rep && rep > 0){ st.done += Math.max(0,Math.min(rep,st.reps)-Math.min(st.rep,st.reps)); st.rep = rep; say(kor(Math.min(rep,st.reps)),880); }
      $('big').textContent = Math.min(st.rep,st.reps)+' / '+st.reps;
      var dir = st.ex === 'jack' ? (p < .5 ? '벌려요!' : '모아요!') : st.ex === 'burpee' ? (p < .18 ? '앉고' : p < .56 ? '엎드려 버티고' : p < .8 ? '다시 앉고' : '점프!') : (p < .5 ? '천천히 내려가요' : '힘차게 올라와요');
      $('say').textContent = (st.ex === 'lunge' ? (st.rep%2 ? '오른발 앞 · ' : '왼발 앞 · ') : '')+dir; $('bar').style.width = Math.min(100,ph/st.reps*100)+'%'; $('cue').textContent = d.cues[Math.floor(ph/3)%3];
      if (st.rep >= st.reps) setDone();
    }
  } else if (st.stage === 'rest'){
    var rl = Math.max(0,st.rest-Math.floor(t)); draw('idle',(t/3)%1,0); $('big').textContent = rl+'초'; $('say').textContent = '쉬는 시간 · 물 한 모금, 숨 고르기'; $('bar').style.width = (t/st.rest*100)+'%'; $('cue').textContent = '다음은 '+st.set+'세트 / '+st.sets;
    if (rl !== st.last){ st.last = rl; if (rl <= 3 && rl > 0) say(KN[rl],660); }
    if (t >= st.rest){ st.stage = 'ready'; st.t0 = now; st.last = -1; }
  }
  requestAnimationFrame(tick);
}
renderLog(); pick('squat'); requestAnimationFrame(tick);
</script>
