<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의창초 SW·AI 연수 자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#e8f3ff; --blue:#3f86f2; --blue-dark:#1d4fa8; --yellow:#ffd54a;
    --ink:#23324d; --white:#ffffff; --mint:#d9f5ea; --muted:#5d6c8c; --side:268px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink); line-height:1.5; background:var(--sky);
    display:flex; overflow:hidden;
  }
  button{font:inherit;color:inherit;cursor:pointer}

  /* ---------- 왼쪽 목차 ---------- */
  aside{
    flex:0 0 var(--side); width:var(--side); height:100%;
    background:var(--white); border-right:4px solid var(--ink);
    display:flex; flex-direction:column; overflow-y:auto;
    padding:calc(18px + env(safe-area-inset-top,0)) 14px calc(18px + env(safe-area-inset-bottom,0));
    z-index:20;
  }
  .brand{
    display:flex;align-items:center;gap:10px;border:none;background:none;text-align:left;
    padding:4px 6px 14px;border-bottom:3px dashed #cfdcf1;margin-bottom:10px;
  }
  .brand svg{width:46px;height:46px;flex:0 0 46px}
  .brand span{font-size:21px;line-height:1.25}
  .brand b{color:var(--blue)}
  .group{font-size:15px;color:var(--muted);margin:16px 8px 6px}
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:transparent;border:3px solid transparent;border-radius:16px;
    padding:8px 10px;margin-bottom:4px;font-size:19px;
  }
  .nav-item:hover{background:var(--sky)}
  .nav-item:focus-visible{outline:3px solid var(--blue-dark);outline-offset:2px}
  .nav-item.active{background:var(--yellow);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
  .nav-item .ni{flex:0 0 34px;width:34px;height:34px;display:grid;place-items:center;font-size:22px}
  .nav-item .ni svg{width:34px;height:34px}
  .nav-item .lbl{flex:1}
  .tag{font-size:13px;background:#eef1f6;color:#7b869c;border-radius:999px;padding:1px 9px}
  .nav-item.off{opacity:.65}
  .foot{margin-top:auto;font-size:14px;color:var(--muted);padding:14px 8px 0}

  /* ---------- 오른쪽 화면 ---------- */
  .stage{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;
    background-color:var(--sky);background-image:radial-gradient(#cfe4fb 2px,transparent 2px);background-size:26px 26px}
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top,0)) 16px 10px;
    background:var(--white);border-bottom:4px solid var(--ink);
  }
  .menu-btn{display:none;background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:2px 12px;font-size:20px}
  .crumb{flex:1;min-width:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .open-new{
    flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--yellow);
    border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:17px;box-shadow:0 3px 0 var(--ink);
  }
  .open-new[hidden]{display:none}
  .open-new:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .viewport{flex:1;min-height:0;position:relative}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--white)}
  .panel{position:absolute;inset:0;overflow-y:auto;padding:28px 22px 40px}
  .panel .wrap{max-width:640px;margin:0 auto}

  /* 홈 / 안내 말풍선 */
  .title{
    display:block;width:fit-content;margin:0 auto 8px;background:var(--white);border:4px solid var(--ink);
    border-radius:28px;padding:12px 22px;box-shadow:0 6px 0 var(--ink);
    font-size:clamp(24px,5vw,32px);line-height:1.3;text-align:center;font-weight:400;
  }
  .title b{color:var(--blue)}
  .sub{text-align:center;font-size:18px;margin:16px 0 28px}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .row.flip{flex-direction:row-reverse}
  .char{flex:0 0 100px;width:100px;height:100px;animation:bob 2.6s ease-in-out infinite}
  .row.flip .char{animation-delay:-1.3s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .bubble{position:relative;flex:1;background:var(--white);border:4px solid var(--ink);border-radius:26px;padding:16px 18px 18px;box-shadow:0 6px 0 var(--ink)}
  .bubble::before{content:"";position:absolute;top:38px;left:-17px;width:26px;height:26px;background:var(--white);
    border-left:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg)}
  .row.flip .bubble::before{left:auto;right:-17px;transform:rotate(-135deg)}
  .bubble h2{margin:0 0 4px;font-size:22px;font-weight:400}
  .bubble p{margin:0 0 12px;font-size:17px;color:#46557a}
  .btn{
    display:block;width:100%;text-align:center;text-decoration:none;color:var(--ink);
    font-size:20px;padding:11px 16px;border:4px solid var(--ink);border-radius:999px;
    box-shadow:0 5px 0 var(--ink);background:var(--yellow);transition:transform .1s,box-shadow .1s;
  }
  .btn.b{background:var(--blue);color:var(--white)}
  .btn.m{background:#6fd8b4}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .btn:focus-visible{outline:4px solid var(--blue-dark);outline-offset:4px}

  /* 연수 활동 순서 */
  .agenda{display:grid;gap:7px;margin:0 auto 28px;padding:15px 18px;border:3px solid var(--ink);
    border-radius:17px;background:var(--mint);font-size:17px;box-shadow:0 4px 0 var(--ink)}
  .agenda b{font-size:20px;color:var(--blue-dark)}
  .agenda span{display:block}

  /* ---------- 모바일 ---------- */
  .scrim{display:none}
  @media (max-width:760px){
    aside{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .2s;box-shadow:6px 0 0 rgba(35,50,77,.25)}
    body.drawer aside{transform:none}
    body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(35,50,77,.35);z-index:10}
    .menu-btn{display:block}
    .char{flex-basis:80px;width:80px;height:80px}
    .panel{padding:22px 14px 34px}
  }
  @media (prefers-reduced-motion:reduce){.char{animation:none}aside{transition:none}}
</style>
</head>
<body>

<!-- 캐릭터 그림 모음 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="chick" viewBox="0 0 120 120">
    <path d="M60 22 C58 12 50 10 46 14 C54 14 57 18 58 24 Z" fill="#5cc98a" stroke="#23324d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M60 22 C62 12 70 10 74 14 C66 14 63 18 62 24 Z" fill="#5cc98a" stroke="#23324d" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="60" cy="64" r="42" fill="#ffd54a" stroke="#23324d" stroke-width="4"/>
    <ellipse cx="20" cy="72" rx="9" ry="14" fill="#ffc21f" stroke="#23324d" stroke-width="3" transform="rotate(20 20 72)"/>
    <ellipse cx="100" cy="72" rx="9" ry="14" fill="#ffc21f" stroke="#23324d" stroke-width="3" transform="rotate(-20 100 72)"/>
    <circle cx="44" cy="58" r="5.5" fill="#23324d"/><circle cx="76" cy="58" r="5.5" fill="#23324d"/>
    <circle cx="46" cy="56" r="1.8" fill="#fff"/><circle cx="78" cy="56" r="1.8" fill="#fff"/>
    <ellipse cx="34" cy="72" rx="7" ry="4.5" fill="#ff9db4"/><ellipse cx="86" cy="72" rx="7" ry="4.5" fill="#ff9db4"/>
    <path d="M52 68 L68 68 L60 80 Z" fill="#ff8a3d" stroke="#23324d" stroke-width="3" stroke-linejoin="round"/>
  </symbol>
  <symbol id="robot" viewBox="0 0 120 120">
    <line x1="60" y1="24" x2="60" y2="12" stroke="#23324d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="10" r="6" fill="#ffd54a" stroke="#23324d" stroke-width="3"/>
    <rect x="8" y="54" width="14" height="26" rx="7" fill="#9cc4fb" stroke="#23324d" stroke-width="3"/>
    <rect x="98" y="54" width="14" height="26" rx="7" fill="#9cc4fb" stroke="#23324d" stroke-width="3"/>
    <rect x="18" y="24" width="84" height="76" rx="26" fill="#3f86f2" stroke="#23324d" stroke-width="4"/>
    <rect x="28" y="38" width="64" height="46" rx="18" fill="#fff" stroke="#23324d" stroke-width="3"/>
    <path d="M38 62 Q45 52 52 62" fill="none" stroke="#23324d" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M68 62 Q75 52 82 62" fill="none" stroke="#23324d" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="38" cy="73" rx="6" ry="4" fill="#ff9db4"/><ellipse cx="82" cy="73" rx="6" ry="4" fill="#ff9db4"/>
    <path d="M54 72 Q60 79 66 72" fill="none" stroke="#23324d" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>
  <symbol id="cat" viewBox="0 0 120 120">
    <path d="M24 44 L22 8 L52 28 Z" fill="#6fd8b4" stroke="#23324d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M96 44 L98 8 L68 28 Z" fill="#6fd8b4" stroke="#23324d" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="60" cy="66" rx="46" ry="40" fill="#6fd8b4" stroke="#23324d" stroke-width="4"/>
    <circle cx="42" cy="62" r="5.5" fill="#23324d"/><circle cx="78" cy="62" r="5.5" fill="#23324d"/>
    <circle cx="44" cy="60" r="1.8" fill="#fff"/><circle cx="80" cy="60" r="1.8" fill="#fff"/>
    <ellipse cx="30" cy="76" rx="7" ry="4.5" fill="#ff9db4"/><ellipse cx="90" cy="76" rx="7" ry="4.5" fill="#ff9db4"/>
    <path d="M52 76 Q56 82 60 76 Q64 82 68 76" fill="none" stroke="#23324d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<aside id="side" aria-label="목차">
  <button class="brand" id="homeBtn" type="button">
    <svg aria-hidden="true"><use href="#chick"/></svg>
    <span>의창초 <b>SW·AI</b><br>연수 자료실</span>
  </button>
  <nav id="nav"></nav>
  <div class="foot">로그인 없이 살펴볼 수 있어요.<br>학생 개인정보는 입력하지 마세요.</div>
</aside>
<div class="scrim" id="scrim"></div>

<section class="stage">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="목차 열기">☰</button>
    <div class="crumb" id="crumb">처음 화면</div>
    <a class="open-new" id="openNew" href="#" target="_blank" rel="noopener" hidden>새 탭으로 열기</a>
  </div>
  <div class="viewport" id="view"></div>
</section>

<script>
  // ▼ 링크를 따옴표 안에 붙여 넣으세요. 비워 두면 "준비 중"으로 보여요.
  var CANVA_URL = "";   // 캔바 연수 자료 공유 링크

  // embed:false 는 이 화면 안에서 열 수 없는 주소일 때. roulette.html, muscle-beach.html 은 index.html 과 같은 폴더에 함께 올려야 해요.
  var ITEMS = [
    {id:"canva",    group:"연수",      title:"캔바 연수 자료",     icon:"chick", url:CANVA_URL, embed:true},
    {id:"gallery",  group:"연수",      title:"SW·AI 사이트 갤러리", icon:"robot", url:"https://seongmoon777-debug.github.io/sw-ai-gallery/", embed:true},
    {id:"world",    group:"수업 활용 예시", title:"문스쿨 모험마을",     emoji:"🏘️",  url:"https://seongmoon777-debug.github.io/class-world/", embed:true},
    {id:"jump",     group:"수업 활용 예시", title:"음악줄넘기 조 편성",  emoji:"🪢",  url:"https://seongmoon777-debug.github.io/music-jump-rope/", embed:true},
    {id:"roulette", group:"수업 활용 예시", title:"급식 줄서기 룰렛",      emoji:"🎡",  url:"roulette.html", embed:true},
    {id:"pe",       group:"수업 활용 예시", title:"체육전담 스케줄러",   emoji:"📅",  url:"https://seongmoon777-debug.github.io/sw-ai-gallery/pe-scheduler/index.html", embed:true},
    {id:"gym",      group:"수업 활용 예시", title:"머슬 비치 체육관",    emoji:"💪",  url:"muscle-beach.html", embed:true}
  ];

  var nav = document.getElementById("nav");
  var view = document.getElementById("view");
  var crumb = document.getElementById("crumb");
  var openNew = document.getElementById("openNew");
  var current = null;

  // 주소 뒤 #이름 갱신. 미리보기처럼 막힌 환경에서는 조용히 건너뜀
  function setHash(h){
    try {
      history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
    } catch (e) {}
  }

  function embedUrl(it){
    var u = it.url;
    if (u.indexOf("canva.com") > -1 && u.indexOf("embed") === -1) {
      u += (u.indexOf("?") > -1 ? "&" : "?") + "embed";
    }
    return u;
  }

  // 목차 만들기
  var lastGroup = "";
  ITEMS.forEach(function (it) {
    if (it.group !== lastGroup) {
      var g = document.createElement("div");
      g.className = "group"; g.textContent = it.group;
      nav.appendChild(g); lastGroup = it.group;
    }
    var b = document.createElement("button");
    b.type = "button"; b.className = "nav-item"; b.dataset.id = it.id;
    var ic = it.icon ? '<span class="ni"><svg aria-hidden="true"><use href="#' + it.icon + '"/></svg></span>'
                     : '<span class="ni">' + it.emoji + '</span>';
    b.innerHTML = ic + '<span class="lbl">' + it.title + '</span>' + (it.url ? "" : '<em class="tag">준비 중</em>');
    if (!it.url) b.classList.add("off");
    b.addEventListener("click", function () { show(it.id); });
    nav.appendChild(b);
  });

  function setActive(id){
    document.querySelectorAll(".nav-item").forEach(function (n) {
      n.classList.toggle("active", n.dataset.id === id);
    });
  }

  function row(flip, sym, h, p, btnClass, btnText, id){
    return '<div class="row' + (flip ? " flip" : "") + '">' +
      '<svg class="char" aria-hidden="true"><use href="#' + sym + '"/></svg>' +
      '<div class="bubble"><h2>' + h + '</h2><p>' + p + '</p>' +
      '<button class="btn ' + btnClass + '" type="button" data-go="' + id + '">' + btnText + '</button></div></div>';
  }

  function home(){
    current = null; setActive(null);
    crumb.textContent = "처음 화면"; openNew.hidden = true;
    view.innerHTML = '<div class="panel"><div class="wrap">' +
      '<h1 class="title">의창초 <b>SW·AI</b> 연수 자료실</h1>' +
      '<p class="sub">AI·디지털 도구를 직접 열어 보고 수업 활용 사례를 체험해 보세요.<br>왼쪽 목차에서 자료를 선택할 수 있어요.</p>' +
      '<div class="agenda"><b>오늘의 탐색 순서</b><span>① 사이트 갤러리 둘러보기</span><span>② 교실 활용 도구 체험하기</span><span>③ 나의 수업에 적용해 보기</span></div>' +
      row(false, "chick", "안녕! 나는 일단지야", "캔바 발표 자료는 추후 연결할게요. 지금은 다른 자료를 먼저 둘러보세요!", "", "캔바 자료 확인", "canva") +
      row(true, "robot", "나는 로봇 이단지!", "수업에 바로 쓸 수 있는 사이트를 모아 뒀어요.", "b", "갤러리 보기", "gallery") +
      row(false, "cat", "삼단지는 참고 자료 담당!", "AI로 제작한 학급 운영 도구를 직접 체험해 보세요.", "m", "활용 예시 보기", "world") +
      '</div></div>';
    view.querySelectorAll("[data-go]").forEach(function (x) {
      x.addEventListener("click", function () { show(x.dataset.go); });
    });
    setHash("");
  }

  function notice(sym, h, p, url){
    return '<div class="panel"><div class="wrap">' +
      '<div class="row"><svg class="char" aria-hidden="true"><use href="#' + sym + '"/></svg>' +
      '<div class="bubble"><h2>' + h + '</h2><p>' + p + '</p>' +
      (url ? '<a class="btn" href="' + url + '" target="_blank" rel="noopener">새 탭으로 열기</a>' : "") +
      '</div></div></div></div>';
  }

  function show(id){
    var it = ITEMS.filter(function (x) { return x.id === id; })[0];
    if (!it) { home(); return; }
    current = it; setActive(id);
    crumb.textContent = it.title;
    document.body.classList.remove("drawer");
    setHash(id);

    if (!it.url) {
      openNew.hidden = true;
      view.innerHTML = notice("cat", "캔바 자료는 준비 중이에요", "추후 캔바 발표 자료 링크를 연결하면 이곳에서 바로 열 수 있어요. 현재는 갤러리와 수업 활용 예시를 체험해 주세요.", "");
      return;
    }
    openNew.href = it.url; openNew.hidden = false;
    if (!it.embed) {
      view.innerHTML = notice("robot", "새 탭에서 열어 주세요", "이 자료는 이 화면 안에서는 열 수 없어요. 아래 버튼을 눌러 주세요!", it.url);
      return;
    }
    view.innerHTML = '<iframe title="' + it.title + '" src="' + embedUrl(it) + '" allow="fullscreen" referrerpolicy="no-referrer"></iframe>';
  }


  // 화면 안에서 열기가 막히면(미리보기 등) 안내 + 새 탭 버튼으로 바꿔 줌
  document.addEventListener("securitypolicyviolation", function (e) {
    if (current && /frame|child/.test(e.violatedDirective)) {
      view.innerHTML = notice("robot", "새 탭에서 열어 주세요", "이 화면 안에서는 열 수 없어요. 아래 버튼을 눌러 주세요!", current.url);
    }
  });

  // 모바일 목차 열고 닫기
  document.getElementById("menuBtn").addEventListener("click", function () { document.body.classList.toggle("drawer"); });
  document.getElementById("scrim").addEventListener("click", function () { document.body.classList.remove("drawer"); });
  document.getElementById("homeBtn").addEventListener("click", function () { home(); document.body.classList.remove("drawer"); });

  // 처음 열 때: 주소 뒤 #gallery 처럼 붙어 있으면 바로 그 화면
  var start = location.hash.replace("#", "");
  if (start) { show(start); } else { home(); if (window.innerWidth <= 760) document.body.classList.add("drawer"); }
</script>
</body>
</html>
